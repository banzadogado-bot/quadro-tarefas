<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quadro de Tarefas</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23163a5f'/%3E%3Crect x='6' y='8' width='5' height='16' rx='1.5' fill='%23e8eef5'/%3E%3Crect x='13.5' y='8' width='5' height='11' rx='1.5' fill='%23f2b544'/%3E%3Crect x='21' y='8' width='5' height='7' rx='1.5' fill='%233fb27f'/%3E%3C/svg%3E">
<style>
  :root {
    --bg: #eef1f5;
    --surface: #ffffff;
    --surface-2: #f6f8fb;
    --ink: #172433;
    --ink-2: #4a5a6c;
    --ink-3: #7d8b9b;
    --line: #dde3ea;
    --brand: #163a5f;
    --brand-ink: #ffffff;
    --todo: #64748b;
    --doing: #c98a12;
    --doing-bg: #fff6e3;
    --done: #23905f;
    --done-bg: #e7f6ee;
    --late: #c8372d;
    --late-bg: #fdecea;
    --window: #9a6b00;
    --window-bg: #fff4d6;
    --muted-bg: #eef2f6;
    --focus: #2f6fb3;
    --shadow: 0 1px 2px rgba(16, 32, 52, .06), 0 2px 8px rgba(16, 32, 52, .05);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0f151c; --surface: #18212b; --surface-2: #1d2833; --ink: #e6edf4; --ink-2: #b2bfcc;
      --ink-3: #8394a6; --line: #2a3643; --brand: #5d9bd6; --brand-ink: #0c1620; --todo: #94a3b8;
      --doing: #f0b544; --doing-bg: #33270f; --done: #4cc58d; --done-bg: #12301f; --late: #f07368;
      --late-bg: #3a1a17; --window: #f0c45a; --window-bg: #352a0c; --muted-bg: #222d39; --focus: #7fb4e8;
      --shadow: 0 1px 2px rgba(0,0,0,.3);
    }
  }
  :root[data-theme="dark"] {
    --bg: #0f151c; --surface: #18212b; --surface-2: #1d2833; --ink: #e6edf4; --ink-2: #b2bfcc;
    --ink-3: #8394a6; --line: #2a3643; --brand: #5d9bd6; --brand-ink: #0c1620; --todo: #94a3b8;
    --doing: #f0b544; --doing-bg: #33270f; --done: #4cc58d; --done-bg: #12301f; --late: #f07368;
    --late-bg: #3a1a17; --window: #f0c45a; --window-bg: #352a0c; --muted-bg: #222d39; --focus: #7fb4e8;
    --shadow: 0 1px 2px rgba(0,0,0,.3);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--bg); color: var(--ink);
    font: 15px/1.45 "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
    min-height: 100vh;
  }
  button { font: inherit; color: inherit; cursor: pointer; }
  button:focus-visible, input:focus-visible, textarea:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
  .hidden { display: none !important; }

  /* ---------- topo ---------- */
  header.top {
    display: flex; align-items: center; gap: 16px; padding: 12px 24px;
    background: var(--surface); border-bottom: 1px solid var(--line);
    position: sticky; top: 0; z-index: 5;
  }
  .logo { display: flex; align-items: center; gap: 10px; font-weight: 700; letter-spacing: -.01em; }
  .logo svg { width: 26px; height: 26px; }
  .top .who { margin-left: auto; display: flex; align-items: center; gap: 12px; color: var(--ink-2); }
  .top .who strong { color: var(--ink); }
  .btn {
    border: 1px solid var(--line); background: var(--surface); border-radius: 8px;
    padding: 7px 14px; font-weight: 600; font-size: 14px;
  }
  .btn:hover { background: var(--surface-2); }
  .btn.primary { background: var(--brand); color: var(--brand-ink); border-color: var(--brand); }
  .btn.primary:hover { filter: brightness(1.08); }
  .btn.danger { color: var(--late); }
  .btn:disabled { opacity: .55; cursor: default; }

  /* ---------- login ---------- */
  #tela-login { max-width: 760px; margin: 0 auto; padding: 56px 24px; }
  #tela-login h1 { font-size: 28px; margin: 0 0 6px; letter-spacing: -.02em; }
  #tela-login .sub { color: var(--ink-2); margin: 0 0 32px; }
  .nomes { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 14px; }
  .nome {
    background: var(--surface); border: 1px solid var(--line); border-radius: 14px;
    padding: 22px 18px; text-align: left; box-shadow: var(--shadow);
    display: flex; flex-direction: column; gap: 14px; transition: transform .08s, border-color .08s;
  }
  .nome:hover { border-color: var(--brand); transform: translateY(-1px); }
  .avatar {
    width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center;
    font-weight: 700; font-size: 18px; color: #fff;
  }
  .nome span { font-size: 18px; font-weight: 600; }
  .pin-box {
    background: var(--surface); border: 1px solid var(--line); border-radius: 16px;
    padding: 28px; max-width: 360px; margin: 0 auto; box-shadow: var(--shadow); text-align: center;
  }
  .pin-box h2 { margin: 12px 0 4px; font-size: 20px; }
  .pin-box .avatar { margin: 0 auto; width: 56px; height: 56px; font-size: 22px; }
  .pin-dots { display: flex; gap: 14px; justify-content: center; margin: 20px 0 8px; }
  .pin-dots i { width: 16px; height: 16px; border-radius: 50%; border: 2px solid var(--ink-3); }
  .pin-dots i.on { background: var(--ink); border-color: var(--ink); }
  .pin-erro { color: var(--late); min-height: 22px; font-size: 14px; }
  .teclado { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 8px; }
  .teclado button {
    padding: 14px 0; font-size: 20px; font-weight: 600; border-radius: 10px;
    border: 1px solid var(--line); background: var(--surface-2);
  }
  .teclado button:hover { background: var(--muted-bg); }
  .teclado .acao { font-size: 14px; color: var(--ink-2); }
  .voltar { margin-top: 16px; background: none; border: none; color: var(--ink-2); text-decoration: underline; }
  #pin-input { position: absolute; opacity: 0; pointer-events: none; width: 1px; height: 1px; }

  /* ---------- quadro ---------- */
  #tela-quadro { padding: 20px 24px 40px; }
  .barra { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; flex-wrap: wrap; }
  .barra h1 { margin: 0; font-size: 22px; letter-spacing: -.01em; }
  .barra .data { color: var(--ink-2); }
  .barra .resumo { display: flex; gap: 8px; margin-left: auto; flex-wrap: wrap; }
  .chip { font-size: 13px; padding: 4px 10px; border-radius: 999px; background: var(--muted-bg); color: var(--ink-2); font-weight: 600; }
  .chip.late { background: var(--late-bg); color: var(--late); }
  .colunas { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; align-items: start; }
  .coluna { background: var(--surface-2); border: 1px solid var(--line); border-radius: 14px; padding: 12px; min-height: 200px; }
  .coluna-topo { display: flex; align-items: center; gap: 8px; padding: 4px 6px 12px; font-weight: 700; }
  .coluna-topo .bola { width: 10px; height: 10px; border-radius: 50%; }
  .coluna-topo .qtd { margin-left: auto; color: var(--ink-3); font-weight: 600; }
  .col-todo .bola { background: var(--todo); }
  .col-doing .bola { background: var(--doing); }
  .col-done .bola { background: var(--done); }
  .lista { display: flex; flex-direction: column; gap: 10px; }
  .vazio { color: var(--ink-3); text-align: center; padding: 28px 8px; font-size: 14px; }

  .card {
    background: var(--surface); border: 1px solid var(--line); border-left: 4px solid var(--line);
    border-radius: 10px; padding: 12px 12px 10px; box-shadow: var(--shadow);
  }
  .card.s-em_processamento { border-left-color: var(--doing); }
  .card.s-concluido { border-left-color: var(--done); }
  .card.s-concluido .titulo { color: var(--ink-2); }
  .card.atrasada { border-left-color: var(--late); background: var(--late-bg); border-color: color-mix(in srgb, var(--late) 35%, var(--line)); }
  .card .linha1 { display: flex; gap: 8px; align-items: flex-start; }
  .card .titulo { font-weight: 650; font-size: 15px; flex: 1; word-break: break-word; }
  .card .hora { font-variant-numeric: tabular-nums; font-weight: 700; font-size: 13px; color: var(--ink-2); white-space: nowrap; }
  .card .desc { color: var(--ink-2); font-size: 13px; margin-top: 4px; white-space: pre-wrap; }
  .tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .tag { font-size: 12px; font-weight: 600; padding: 2px 8px; border-radius: 6px; background: var(--muted-bg); color: var(--ink-2); }
  .tag.late { background: var(--late); color: #fff; }
  .tag.window { background: var(--window-bg); color: var(--window); }
  .tag.adiada { background: var(--muted-bg); color: var(--ink-2); }
  .tag.voltas { background: var(--doing-bg); color: var(--doing); }
  .tag.tempo { background: var(--muted-bg); font-variant-numeric: tabular-nums; }
  .tag.doing { background: var(--doing-bg); color: var(--doing); font-variant-numeric: tabular-nums; }
  .tag.done { background: var(--done-bg); color: var(--done); }
  .obs { margin-top: 8px; font-size: 13px; padding: 6px 8px; border-radius: 6px; background: var(--surface-2); color: var(--ink-2); white-space: pre-wrap; word-break: break-word; }
  .obs b { color: var(--ink); }
  .acoes { display: flex; gap: 6px; margin-top: 10px; flex-wrap: wrap; align-items: center; }
  .acoes .btn { padding: 5px 10px; font-size: 13px; }
  .acoes .mais { margin-left: auto; display: flex; gap: 2px; }
  .link { background: none; border: none; color: var(--ink-3); font-size: 13px; padding: 4px 6px; border-radius: 6px; }
  .link:hover { color: var(--ink); background: var(--muted-bg); }
  .link.danger:hover { color: var(--late); }

  /* ---------- modal ---------- */
  .fundo { position: fixed; inset: 0; background: rgba(10, 20, 30, .45); display: grid; place-items: center; z-index: 20; padding: 16px; }
  .modal { background: var(--surface); border-radius: 14px; padding: 22px; width: 100%; max-width: 460px; box-shadow: 0 10px 40px rgba(0,0,0,.25); }
  .modal h3 { margin: 0 0 4px; font-size: 18px; }
  .modal p { margin: 0 0 14px; color: var(--ink-2); font-size: 14px; }
  .modal label { display: block; font-weight: 600; font-size: 13px; margin: 10px 0 4px; }
  .modal input, .modal textarea {
    width: 100%; font: inherit; color: var(--ink); background: var(--surface-2);
    border: 1px solid var(--line); border-radius: 8px; padding: 9px 10px;
  }
  .modal textarea { min-height: 84px; resize: vertical; }
  .modal .erro { color: var(--late); font-size: 13px; min-height: 18px; margin-top: 6px; }
  .modal .botoes { display: flex; justify-content: flex-end; gap: 8px; margin-top: 14px; }

  .aviso {
    position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); z-index: 30;
    background: var(--ink); color: var(--surface); padding: 10px 16px; border-radius: 10px;
    font-size: 14px; box-shadow: 0 6px 24px rgba(0,0,0,.25); max-width: 90vw;
  }
  .aviso.erro { background: var(--late); color: #fff; }
  .status-rede { font-size: 12px; color: var(--ink-3); }
  .status-rede.off { color: var(--late); font-weight: 600; }

  @media (max-width: 900px) {
    .colunas { grid-template-columns: 1fr; }
    header.top, #tela-quadro { padding-left: 16px; padding-right: 16px; }
  }
</style>
</head>
<body>

<header class="top">
  <div class="logo">
    <svg viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="7" fill="var(--brand)"/><rect x="6" y="8" width="5" height="16" rx="1.5" fill="#e8eef5"/><rect x="13.5" y="8" width="5" height="11" rx="1.5" fill="#f2b544"/><rect x="21" y="8" width="5" height="7" rx="1.5" fill="#3fb27f"/></svg>
    Quadro de Tarefas
  </div>
  <div class="who hidden" id="topo-usuario">
    <span class="status-rede" id="status-rede"></span>
    <span>Olá, <strong id="topo-nome"></strong></span>
    <button class="btn" id="btn-sair" type="button">Sair</button>
  </div>
</header>

<!-- ================= LOGIN ================= -->
<main id="tela-login" class="hidden">
  <div id="passo-nomes">
    <h1>Quem está trabalhando?</h1>
    <p class="sub">Clique no seu nome e digite seu PIN de 4 números.</p>
    <div class="nomes" id="lista-nomes"></div>
    <p class="vazio hidden" id="nomes-erro"></p>
  </div>
  <div id="passo-pin" class="hidden">
    <div class="pin-box">
      <div class="avatar" id="pin-avatar"></div>
      <h2 id="pin-nome"></h2>
      <div style="color:var(--ink-2);font-size:14px">Digite seu PIN</div>
      <input id="pin-input" inputmode="numeric" autocomplete="off" maxlength="4" aria-label="PIN">
      <div class="pin-dots" id="pin-dots"><i></i><i></i><i></i><i></i></div>
      <div class="pin-erro" id="pin-erro" role="alert"></div>
      <div class="teclado" id="teclado"></div>
      <button class="voltar" id="btn-voltar-nomes" type="button">Não sou eu, voltar</button>
    </div>
  </div>
</main>

<!-- ================= QUADRO ================= -->
<main id="tela-quadro" class="hidden">
  <div class="barra">
    <h1 id="quadro-titulo">Minhas tarefas</h1>
    <span class="data" id="quadro-data"></span>
    <button class="btn primary" id="btn-nova" type="button">+ Nova tarefa</button>
    <div class="resumo" id="resumo"></div>
  </div>
  <div class="colunas">
    <section class="coluna col-todo" data-col="nao_processado">
      <div class="coluna-topo"><span class="bola"></span>Não processado<span class="qtd"></span></div>
      <div class="lista"></div>
    </section>
    <section class="coluna col-doing" data-col="em_processamento">
      <div class="coluna-topo"><span class="bola"></span>Em processamento<span class="qtd"></span></div>
      <div class="lista"></div>
    </section>
    <section class="coluna col-done" data-col="concluido">
      <div class="coluna-topo"><span class="bola"></span>Concluído hoje<span class="qtd"></span></div>
      <div class="lista"></div>
    </section>
  </div>
</main>

<div id="modal-raiz"></div>
<div id="aviso-raiz"></div>

<script>
/* =====================================================================
   CONFIGURAÇÃO — endereço e chave pública do Supabase
   (a chave "publishable" é feita pra ficar no site; as tabelas
    continuam fechadas, tudo passa pelas funções que exigem PIN)
   ===================================================================== */
const CONFIG = {
  url: 'https://wcpxbipoeqbzmavemwpa.supabase.co',
  key: 'sb_publishable_5KuexCMnfO1OUDyHaCRgHg_pF0vS-Cw',
  atualizarCadaMs: 15000,
};

/* ------------------------- utilidades ------------------------- */
const $ = (s, el = document) => el.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const CORES = ['#2f6fb3', '#b4572a', '#2f8f6b', '#7a52b3', '#b03a64', '#3f7d8c'];
const corDe = (id) => CORES[(Number(id) - 1 + CORES.length) % CORES.length];
const DIAS = ['domingo', 'segunda', 'terça', 'quarta', 'quinta', 'sexta', 'sábado'];
const DIAS_CURTO = ['dom', 'seg', 'ter', 'qua', 'qui', 'sex', 'sáb'];
const parseDia = (iso) => { const [a, m, d] = iso.split('-').map(Number); return new Date(a, m - 1, d); };
const fmtDiaCurto = (iso) => { const d = parseDia(iso); return `${DIAS_CURTO[d.getDay()]} ${String(d.getDate()).padStart(2, '0')}/${String(d.getMonth() + 1).padStart(2, '0')}`; };
const fmtDiaLongo = (iso) => { const d = parseDia(iso); return `${DIAS[d.getDay()]}, ${String(d.getDate()).padStart(2, '0')}/${String(d.getMonth() + 1).padStart(2, '0')}/${d.getFullYear()}`; };
const fmtHora = (ts) => new Date(ts).toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit', timeZone: 'America/Sao_Paulo' });
function fmtDuracao(seg) {
  seg = Math.max(0, Math.floor(seg));
  const h = Math.floor(seg / 3600), m = Math.floor((seg % 3600) / 60), s = seg % 60;
  if (h) return `${h}h ${String(m).padStart(2, '0')}min`;
  if (m) return `${m}min ${String(s).padStart(2, '0')}s`;
  return `${s}s`;
}
const guardar = {
  ler(k) { try { return JSON.parse(localStorage.getItem(k)); } catch { return null; } },
  gravar(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
  apagar(k) { try { localStorage.removeItem(k); } catch {} },
};

/* ------------------------- API ------------------------- */
class ErroApi extends Error {}
async function rpc(fn, args = {}) {
  let resp;
  try {
    resp = await fetch(`${CONFIG.url}/rest/v1/rpc/${fn}`, {
      method: 'POST',
      headers: { apikey: CONFIG.key, 'Content-Type': 'application/json' },
      body: JSON.stringify(args),
    });
  } catch {
    marcarRede(false);
    throw new ErroApi('Sem conexão com o servidor. Verifique a internet.');
  }
  marcarRede(true);
  const texto = await resp.text();
  let dados = null;
  if (texto) { try { dados = JSON.parse(texto); } catch { dados = texto; } }
  if (!resp.ok) {
    const msg = (dados && dados.message) || `Erro ${resp.status}`;
    if (msg.startsWith('SESSAO_EXPIRADA')) { sair(true); throw new ErroApi('Sua sessão expirou. Entre de novo.'); }
    throw new ErroApi(msg);
  }
  return dados;
}
function marcarRede(ok) {
  const el = $('#status-rede');
  if (!el) return;
  el.textContent = ok ? '' : '● sem conexão';
  el.classList.toggle('off', !ok);
}

/* ------------------------- avisos e modais ------------------------- */
let avisoTimer;
function avisar(msg, erro = false) {
  const raiz = $('#aviso-raiz');
  raiz.innerHTML = `<div class="aviso ${erro ? 'erro' : ''}" role="status">${esc(msg)}</div>`;
  clearTimeout(avisoTimer);
  avisoTimer = setTimeout(() => (raiz.innerHTML = ''), erro ? 6000 : 2800);
}

// Abre um formulário em modal. campos: [{nome, rotulo, tipo:'texto'|'area', obrigatorio, minimo, valor}]
function formulario({ titulo, texto = '', campos, botao = 'Salvar', perigo = false, enviar }) {
  return new Promise((resolve) => {
    const raiz = $('#modal-raiz');
    raiz.innerHTML = `
      <div class="fundo" data-fechar>
        <form class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-titulo" novalidate>
          <h3 id="modal-titulo">${esc(titulo)}</h3>
          ${texto ? `<p>${esc(texto)}</p>` : ''}
          ${campos.map((c, i) => `
            <label for="campo-${i}">${esc(c.rotulo)}</label>
            ${c.tipo === 'area'
              ? `<textarea id="campo-${i}" name="${c.nome}" maxlength="1000">${esc(c.valor || '')}</textarea>`
              : `<input id="campo-${i}" name="${c.nome}" maxlength="200" value="${esc(c.valor || '')}" autocomplete="off">`}
          `).join('')}
          <div class="erro" role="alert"></div>
          <div class="botoes">
            <button type="button" class="btn" data-cancelar>Cancelar</button>
            <button type="submit" class="btn primary ${perigo ? 'danger' : ''}">${esc(botao)}</button>
          </div>
        </form>
      </div>`;
    const form = $('form', raiz), erroEl = $('.erro', form), btnOk = $('button[type=submit]', form);
    const fechar = (v) => { raiz.innerHTML = ''; document.removeEventListener('keydown', esc_); resolve(v); };
    const esc_ = (e) => { if (e.key === 'Escape') fechar(null); };
    document.addEventListener('keydown', esc_);
    $('[data-cancelar]', form).onclick = () => fechar(null);
    $('.fundo', raiz).addEventListener('mousedown', (e) => { if (e.target.hasAttribute('data-fechar')) fechar(null); });
    form.onsubmit = async (e) => {
      e.preventDefault();
      const valores = {};
      for (const c of campos) {
        const v = form.elements[c.nome].value.trim();
        if (c.obrigatorio && v.length < (c.minimo || 1)) {
          erroEl.textContent = c.minimo > 1 ? `${c.rotulo}: escreva pelo menos ${c.minimo} letras.` : `Preencha: ${c.rotulo}.`;
          form.elements[c.nome].focus();
          return;
        }
        valores[c.nome] = v;
      }
      btnOk.disabled = true; erroEl.textContent = '';
      try { const r = await enviar(valores); fechar(r ?? true); }
      catch (err) { erroEl.textContent = err.message; btnOk.disabled = false; }
    };
    setTimeout(() => form.elements[0] && form.elements[0].focus(), 0);
  });
}

/* ------------------------- sessão ------------------------- */
let sessao = guardar.ler('qt_sessao');   // {token, nome, pessoa_id, gestor}
function sair(expirou = false) {
  const tok = sessao && sessao.token;
  sessao = null; guardar.apagar('qt_sessao');
  pararAtualizacao();
  if (tok && !expirou) rpc('qt_logout', { p_token: tok }).catch(() => {});
  $('#modal-raiz').innerHTML = '';
  mostrarLogin();
  if (expirou) avisar('Sua sessão expirou. Entre de novo com seu PIN.', true);
}

/* ------------------------- LOGIN ------------------------- */
let pessoas = [], pessoaEscolhida = null, pin = '';
async function mostrarLogin() {
  $('#tela-quadro').classList.add('hidden');
  $('#topo-usuario').classList.add('hidden');
  $('#tela-login').classList.remove('hidden');
  $('#passo-pin').classList.add('hidden');
  $('#passo-nomes').classList.remove('hidden');
  const lista = $('#lista-nomes'), erro = $('#nomes-erro');
  lista.innerHTML = ''; erro.classList.add('hidden');
  try {
    pessoas = await rpc('qt_pessoas');
    lista.innerHTML = pessoas.map((p) => `
      <button class="nome" type="button" data-id="${p.id}">
        <span class="avatar" style="background:${corDe(p.id)}">${esc(p.nome[0])}</span>
        <span>${esc(p.nome)}</span>
      </button>`).join('');
  } catch (e) {
    erro.textContent = e.message; erro.classList.remove('hidden');
  }
}
$('#lista-nomes').addEventListener('click', (e) => {
  const b = e.target.closest('.nome'); if (!b) return;
  pessoaEscolhida = pessoas.find((p) => String(p.id) === b.dataset.id);
  abrirPin();
});
function abrirPin() {
  pin = '';
  $('#passo-nomes').classList.add('hidden');
  $('#passo-pin').classList.remove('hidden');
  $('#pin-nome').textContent = pessoaEscolhida.nome;
  const av = $('#pin-avatar'); av.textContent = pessoaEscolhida.nome[0]; av.style.background = corDe(pessoaEscolhida.id);
  $('#pin-erro').textContent = '';
  desenharPin();
  $('#pin-input').value = ''; $('#pin-input').focus();
}
function desenharPin() {
  [...$('#pin-dots').children].forEach((d, i) => d.classList.toggle('on', i < pin.length));
}
$('#teclado').innerHTML = ['1','2','3','4','5','6','7','8','9','limpar','0','apagar']
  .map((k) => `<button type="button" class="${k.length > 1 ? 'acao' : ''}" data-k="${k}">${k === 'apagar' ? '⌫' : k === 'limpar' ? 'Limpar' : k}</button>`).join('');
$('#teclado').addEventListener('click', (e) => {
  const b = e.target.closest('button'); if (!b) return;
  teclaPin(b.dataset.k);
  $('#pin-input').focus();
});
document.addEventListener('keydown', (e) => {
  if ($('#passo-pin').classList.contains('hidden') || $('#modal-raiz').innerHTML) return;
  if (/^[0-9]$/.test(e.key)) { e.preventDefault(); teclaPin(e.key); }
  else if (e.key === 'Backspace') { e.preventDefault(); teclaPin('apagar'); }
  else if (e.key === 'Escape') { mostrarLogin(); }
});
let entrando = false;
async function teclaPin(k) {
  if (entrando) return;
  if (k === 'apagar') pin = pin.slice(0, -1);
  else if (k === 'limpar') pin = '';
  else if (pin.length < 4) pin += k;
  $('#pin-erro').textContent = '';
  desenharPin();
  if (pin.length === 4) {
    entrando = true;
    try {
      const r = await rpc('qt_login', { p_pessoa_id: pessoaEscolhida.id, p_pin: pin });
      if (r.erro) { $('#pin-erro').textContent = r.erro; pin = ''; desenharPin(); return; }
      sessao = r; guardar.gravar('qt_sessao', r);
      mostrarQuadro();
    } catch (e) {
      $('#pin-erro').textContent = e.message; pin = ''; desenharPin();
    } finally { entrando = false; }
  }
}
$('#btn-voltar-nomes').onclick = () => mostrarLogin();
$('#btn-sair').onclick = () => sair();

/* ------------------------- QUADRO ------------------------- */
let tarefas = [], hoje = null, buscadoEm = 0, timerAtualizar = null, timerRelogio = null, carregando = false;

function mostrarQuadro() {
  $('#tela-login').classList.add('hidden');
  $('#tela-quadro').classList.remove('hidden');
  $('#topo-usuario').classList.remove('hidden');
  $('#topo-nome').textContent = sessao.nome;
  $('#quadro-titulo').textContent = 'Minhas tarefas';
  tarefas = []; desenharQuadro();
  carregar();
  iniciarAtualizacao();
}
function iniciarAtualizacao() {
  pararAtualizacao();
  timerAtualizar = setInterval(() => { if (!document.hidden && !$('#modal-raiz').innerHTML) carregar(); }, CONFIG.atualizarCadaMs);
  timerRelogio = setInterval(atualizarCronometros, 1000);
}
function pararAtualizacao() { clearInterval(timerAtualizar); clearInterval(timerRelogio); }
document.addEventListener('visibilitychange', () => { if (!document.hidden && sessao) carregar(); });
window.addEventListener('focus', () => { if (sessao) carregar(); });

async function carregar() {
  if (!sessao || carregando) return;
  carregando = true;
  try {
    const r = await rpc('qt_quadro', { p_token: sessao.token });
    if (!sessao) return;
    tarefas = r.tarefas; hoje = r.hoje; buscadoEm = Date.now();
    desenharQuadro();
  } catch (e) {
    if (sessao) avisar(e.message, true);
  } finally { carregando = false; }
}

function tempoAtual(t) {
  return t.tempo_seg + (t.status === 'em_processamento' ? (Date.now() - buscadoEm) / 1000 : 0);
}
function atualizarCronometros() {
  document.querySelectorAll('[data-cron]').forEach((el) => {
    const t = tarefas.find((x) => String(x.id) === el.dataset.cron);
    if (t) el.textContent = '⏱ ' + fmtDuracao(tempoAtual(t));
  });
}

function cartao(t) {
  const tags = [];
  if (t.atrasada) tags.push(`<span class="tag late">Atrasada · ${t.dias_atraso} dia${t.dias_atraso > 1 ? 's' : ''} (de ${fmtDiaCurto(t.prazo_final)})</span>`);
  else if (t.em_janela) tags.push(`<span class="tag window">Prazo até ${fmtDiaCurto(t.prazo_final)}</span>`);
  if (t.adiada && !t.atrasada && t.status !== 'concluido') tags.push(`<span class="tag adiada" title="${esc(t.motivo_adiamento || '')}">Adiada de ${fmtDiaCurto(t.data_ref)}</span>`);
  tags.push(`<span class="tag">${t.tipo === 'fixa' ? 'Fixa' : 'Variada'}</span>`);
  if (t.voltas > 0) tags.push(`<span class="tag voltas">↺ voltou ${t.voltas}x</span>`);
  if (t.status === 'em_processamento') tags.push(`<span class="tag doing" data-cron="${t.id}">⏱ ${fmtDuracao(tempoAtual(t))}</span>`);
  else if (t.status === 'concluido') tags.push(`<span class="tag done">✓ ${fmtHora(t.concluida_em)} · ${fmtDuracao(t.tempo_seg)}</span>`);
  else if (t.tempo_seg > 0) tags.push(`<span class="tag tempo">⏱ ${fmtDuracao(t.tempo_seg)}</span>`);

  let acoes = '';
  if (t.status === 'nao_processado') acoes = `<button class="btn primary" data-acao="iniciar">▶ Iniciar</button>`;
  else if (t.status === 'em_processamento') acoes = `<button class="btn primary" data-acao="concluir">✓ Concluir</button><button class="btn" data-acao="voltar">Voltar</button>`;
  else if (t.status === 'concluido') acoes = `<button class="btn" data-acao="reabrir">Reabrir</button>`;

  const mais = [`<button class="link" data-acao="obs" title="Escrever observação">✎ Obs.</button>`];
  if (t.status !== 'concluido') mais.push(`<button class="link" data-acao="adiar" title="Passar para o próximo dia, com motivo">Adiar</button>`);
  if (t.tipo === 'variada' && t.status !== 'concluido') mais.push(`<button class="link danger" data-acao="remover" title="Remover tarefa, com motivo">Remover</button>`);

  return `
    <article class="card s-${t.status} ${t.atrasada ? 'atrasada' : ''}" data-id="${t.id}">
      <div class="linha1">
        <div class="titulo">${esc(t.titulo)}</div>
        ${t.horario ? `<div class="hora">${esc(t.horario)}</div>` : ''}
      </div>
      ${t.descricao ? `<div class="desc">${esc(t.descricao)}</div>` : ''}
      <div class="tags">${tags.join('')}</div>
      ${t.observacao ? `<div class="obs"><b>Obs.:</b> ${esc(t.observacao)}</div>` : ''}
      <div class="acoes">${acoes}<span class="mais">${mais.join('')}</span></div>
    </article>`;
}

function desenharQuadro() {
  if (hoje) $('#quadro-data').textContent = fmtDiaLongo(hoje);
  const vazios = { nao_processado: 'Nada pendente. 👌', em_processamento: 'Nenhuma tarefa em andamento.', concluido: 'Nada concluído ainda hoje.' };
  for (const col of document.querySelectorAll('.coluna')) {
    const st = col.dataset.col;
    const doCol = tarefas.filter((t) => t.status === st);
    $('.qtd', col).textContent = doCol.length;
    $('.lista', col).innerHTML = doCol.length ? doCol.map(cartao).join('') : `<div class="vazio">${vazios[st]}</div>`;
  }
  const atrasadas = tarefas.filter((t) => t.atrasada).length;
  const abertas = tarefas.filter((t) => t.status !== 'concluido').length;
  const feitas = tarefas.filter((t) => t.status === 'concluido').length;
  $('#resumo').innerHTML =
    (atrasadas ? `<span class="chip late">${atrasadas} atrasada${atrasadas > 1 ? 's' : ''}</span>` : '') +
    `<span class="chip">${abertas} em aberto</span><span class="chip">${feitas} concluída${feitas === 1 ? '' : 's'}</span>`;
}

async function executar(promessa, ok) {
  try { const r = await promessa; if (ok) avisar(ok); await carregar(); return r; }
  catch (e) { avisar(e.message, true); await carregar(); }
}

document.querySelector('.colunas').addEventListener('click', async (e) => {
  const b = e.target.closest('[data-acao]'); if (!b) return;
  const card = b.closest('.card'); const id = Number(card.dataset.id);
  const t = tarefas.find((x) => x.id === id); if (!t) return;
  const tok = sessao.token;
  const mudar = (s) => { b.disabled = true; return executar(rpc('qt_mudar_status', { p_token: tok, p_tarefa_id: id, p_status: s })); };
  switch (b.dataset.acao) {
    case 'iniciar':  return mudar('em_processamento');
    case 'concluir': return mudar('concluido');
    case 'voltar':   return mudar('nao_processado');
    case 'reabrir':  return mudar('em_processamento');
    case 'obs':
      if (await formulario({
        titulo: 'Observação', texto: t.titulo,
        campos: [{ nome: 'texto', rotulo: 'Observação', tipo: 'area', valor: t.observacao || '' }],
        enviar: (v) => rpc('qt_observacao', { p_token: tok, p_tarefa_id: id, p_texto: v.texto }),
      })) { avisar('Observação salva.'); carregar(); }
      return;
    case 'adiar':
      if (await formulario({
        titulo: 'Adiar para o próximo dia', texto: `"${t.titulo}" sai do quadro de hoje e volta no próximo dia útil. O motivo aparece no relatório do gestor.`,
        campos: [{ nome: 'motivo', rotulo: 'Motivo', tipo: 'area', obrigatorio: true, minimo: 3 }],
        botao: 'Adiar',
        enviar: (v) => rpc('qt_adiar', { p_token: tok, p_tarefa_id: id, p_motivo: v.motivo }),
      })) { avisar('Tarefa adiada.'); carregar(); }
      return;
    case 'remover':
      if (await formulario({
        titulo: 'Remover tarefa', texto: `"${t.titulo}" sai do quadro. O motivo aparece no relatório do gestor.`,
        campos: [{ nome: 'motivo', rotulo: 'Motivo', tipo: 'area', obrigatorio: true, minimo: 3 }],
        botao: 'Remover', perigo: true,
        enviar: (v) => rpc('qt_remover_variada', { p_token: tok, p_tarefa_id: id, p_motivo: v.motivo }),
      })) { avisar('Tarefa removida.'); carregar(); }
      return;
  }
});

$('#btn-nova').onclick = async () => {
  if (await formulario({
    titulo: 'Nova tarefa', texto: 'Tarefa avulsa, só para hoje. Se não for concluída, passa para o dia seguinte como atrasada.',
    campos: [
      { nome: 'titulo', rotulo: 'O que precisa ser feito', obrigatorio: true },
      { nome: 'descricao', rotulo: 'Detalhes (opcional)', tipo: 'area' },
    ],
    botao: 'Adicionar',
    enviar: (v) => rpc('qt_criar_variada', { p_token: sessao.token, p_titulo: v.titulo, p_descricao: v.descricao || null }),
  })) { avisar('Tarefa adicionada.'); carregar(); }
};

/* ------------------------- início ------------------------- */
if (sessao && sessao.token && !sessao.gestor) mostrarQuadro();
else mostrarLogin();
</script>
